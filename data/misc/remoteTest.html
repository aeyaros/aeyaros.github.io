<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<title>TV Remote Pointing Test</title>
	<meta name='author' content='Andrew Yaros'>
	
	<meta name="title" content="TV Remote Pointing Test">
	<meta name="viewport"
	      content="width=device-width, initial-scale=1, maximum-scale=1, minimum-scale=1, viewport-fit=cover">
	<meta name="description"
	      content="A simple game to test skills using a TV remote.">
	
	<link rel="icon" sizes="16x16" href="remote16.png">
	<link rel="icon" sizes="32x32" href="remote32.png">
	<link rel="apple-touch-icon" sizes="180x180" href="remotetesticon.png?v=5">
	
	<!-- Mobile app properties -->
	<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
	<meta name="apple-mobile-web-app-title" content="TV Remote test">
	<meta name="application-name" content="TV Remote test">
	<style>
		
		* {
			cursor: default!important;
		}
		html, body {
			width: 100%;
			height: 100%;
			margin: 0;
			font-family: sans-serif;
			/*cursor: not-allowed;*/
			transition-property: background-color;
			transition-duration: 250ms;
			transition-timing-function: linear;
		}
		
		.dot {
			position: fixed;
			border-radius: 100%;
			box-shadow: 0 10px 20px rgb(0 0 0 / 50%);
			/*cursor: pointer!important;*/
			z-index: 10;
		}
		
		#intro {
			--pad: 1em;
			width: calc(100% - var(--pad));
			height: calc(100% - var(--pad));
			padding: calc(var(--pad) / 2);
			position: fixed;
			/*display: flex;*/
			display: none;/* temporary; this is changed by JS */
			justify-content: center;
			align-items: center;
			z-index: 1000000;
			
			font-size: max(4vw, 30px);
			font-weight: 900;
			text-align: center;
			
			color: white!important;
			background-color: black!important;
			user-select: none;
			/*cursor: pointer!important;*/
		}
		
		#scoreBox {
			display: none; /* temporary; this is changed by JS*/
			position: fixed;
			top: 10px;
			left: 10px;
			font-weight: bold;
			/*font-size: 40px;*/
			font-size: min(max(20px, 3vw), 40px);
		}
		
		#scoreBox, #scoreBox * {
			user-select: none!important;
			z-index: 10000;
		}
		
		#fallback {
			width: 100%;
			height: 100%;
			text-align: center;
			background-image: url("examplescreenshot.png");
			background-size: cover;
			background-position: center, center;
		}
		#fallbackMessage {
			padding: 3em 1em;
			font-weight: bold;
			text-shadow: 1px 1px white;
			
		}
	</style>
	<script>
		
		const px = 'px';
		const BORDERPADDING = 50;
		
		const minWidth = 64, maxWidth = 200, averageWidthDecrement = 3;
		
		let currentAverageWidth = maxWidth;
		
		let score = 0;
		
		let currentDot;
		
		function createDot(diameter) {
			
			const dot = document.createElement('div');
			dot.setAttribute('class', 'dot');
			
			dot.style.width = diameter + px;
			dot.style.height = diameter + px;
			dot.style.backgroundColor = `hsl(${Math.random() * 360} 100% 50%)`;
			
			return dot;
		}
		
		function positionDot(dot) {
			
			const diameter = parseInt(dot.style.width);
			
			const bounds = document.body.getBoundingClientRect(),
				width = parseInt(bounds.width),
				height = parseInt(bounds.height),
				/* the range is the width/height, minus all the border padding, minus the diameter of the circle */
				rangeX = width - (BORDERPADDING*2) - diameter,
				rangeY = height - (BORDERPADDING*2) - diameter;
			
			//clamp to a minimum distance of BORDERPADDING from the top left
			// this is in case the window gets really tiny; we need the dot to be visible once we make the window bigger again
			//without this, dots will be placed past the top or left edge of the screen, making them almost impossible to click
			const left = Math.max(BORDERPADDING, BORDERPADDING + ~~(Math.random() * rangeX));
			const top = Math.max(BORDERPADDING, BORDERPADDING + ~~(Math.random() * rangeY));
			
			dot.style.left = left + px;
			dot.style.top = top + px;
			// console.log(diameter, width, height, rangeX, rangeY, top, left)
		}
		
		function makeRandomDot() {
			//determine diameter
			const initialDiameter = ~~(currentAverageWidth + (Math.random() * (currentAverageWidth / 2)));
			//decrement the width for next time, but not smaller than the minimum
			currentAverageWidth = Math.max(currentAverageWidth - averageWidthDecrement, minWidth);
			
			
			/* scale size of dot to 1080p; don't let them get too small */
			const bodySize = document.body.getBoundingClientRect();
			const diameter = Math.max(
				initialDiameter / 1920 * bodySize.width,
				initialDiameter / 1080 * bodySize.height,
			);
			
			const dot = createDot(diameter);
			positionDot(dot);
			
			currentDot = dot;
			
			dot.onclick = () => {
				document.body.removeChild(dot);
				makeRandomDot();
				
				document.getElementById('score').innerText = ++score;
			}
			document.body.append(dot);
			document.body.style.backgroundColor = `hsl(${Math.random() * 360} 100% 90%)`;
		}
		
		function start() {
			document.body.removeChild(document.getElementById('intro'));
			makeRandomDot();
		}
		
		window.addEventListener('resize', e => {
			// console.log('hi!...', Date.now());
			if(!currentDot) return;
			
			const
				dotBox = currentDot.getBoundingClientRect(),
				bodyBox = document.body.getBoundingClientRect(),
				dotBottom = dotBox.bottom,
				dotRight = dotBox.right,
				bodyBottom = bodyBox.bottom,
				bodyRight = bodyBox.right;
			
			//reposition the dot if it's out of bounds
			if(dotBottom >= bodyBottom || dotRight >= bodyRight) {
				positionDot(currentDot);
			}
			
		});
		
		/* unhide hidden elements */
		window.onload = () => {
			document.getElementById('intro').style.display = 'flex';
			document.getElementById('scoreBox').style.display = 'block';
		}
	</script>
</head>
<body>
	
	<noscript>
		<div id="fallback">
			<div id="fallbackMessage">You've disabled JavaScript. Please enable it and refresh the page.</div>
		</div>
	</noscript>
	
	<div id="intro" onclick="start()">
		Press on each dot using your remote!<br>
		(Press anywhere to continue)
		
	</div>

	<div id="scoreBox">
		Score:
		<span id="score">0</span>
		
	</div>

</body>
</html>
